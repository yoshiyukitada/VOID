
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VOID — Deep Ambient 001</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030304;
  font-family: Arial, sans-serif;
}
canvas {
  position: fixed;
  inset: 0;
  display: block;
}
#start {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,.35);
  color: white;
  cursor: pointer;
}
#title {
  font-size: 30px;
  letter-spacing: .42em;
  margin-left: .42em;
}
#subtitle {
  font-size: 10px;
  letter-spacing: .28em;
  margin-top: 15px;
  color: #bbb;
}
#instruction {
  font-size: 10px;
  letter-spacing: .2em;
  margin-top: 46px;
  color: #aaa;
}
#start.hidden { display: none; }
#caption {
  position: fixed;
  left: 20px;
  bottom: 20px;
  z-index: 3;
  color: rgba(255,255,255,.55);
  font-size: 9px;
  letter-spacing: .22em;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="start">
  <div id="title">VOID</div>
  <div id="subtitle">DEEP AMBIENT / 001</div>
  <div id="instruction">TOUCH TO ENTER</div>
</div>

<div id="caption">A FIELD OF SILENCE</div>

<audio id="ambient"
  src="VOID_Deep_Ambient_001.mp3"
  loop preload="auto"></audio>

<script>
let bg;
let particles = [];
let analyser, frequencyData;
let audioContext;
let started = false;
let energy = 0;
let bass = 0;
let treble = 0;
let pointerX = 0;
let pointerY = 0;
let disturbance = 0;

const COUNT = 420;

function preload() {
  bg = loadImage("void_background.png");
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);

  pointerX = width / 2;
  pointerY = height / 2;

  for (let i = 0; i < COUNT; i++) {
    particles.push(new Particle());
  }

  document.getElementById("start")
    .addEventListener("click", startAudio);
}

async function startAudio() {
  if (started) return;

  const instruction = document.getElementById("instruction");
  instruction.textContent = "ENTERING THE VOID...";

  try {
    const audio = document.getElementById("ambient");

    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();

    await audioContext.resume();

    const source = audioContext.createMediaElementSource(audio);

    const filter = audioContext.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 7000;

    const analyserNode = audioContext.createAnalyser();
    analyserNode.fftSize = 1024;
    analyserNode.smoothingTimeConstant = 0.88;

    const output = audioContext.createGain();
    output.gain.value = 0.85;

    source.connect(filter);
    filter.connect(analyserNode);
    analyserNode.connect(output);
    output.connect(audioContext.destination);

    analyser = analyserNode;
    frequencyData = new Uint8Array(analyser.frequencyBinCount);

    await audio.play();

    started = true;
    document.getElementById("start").classList.add("hidden");

  } catch (e) {
    instruction.textContent =
      "CHECK AUDIO FILE AND TRY AGAIN";
    console.error(e);
  }
}

function draw() {
  // Crop the background image to fill the entire screen.
  clear();

  if (bg) {
    const scale = max(width / bg.width, height / bg.height);
    const w = bg.width * scale;
    const h = bg.height * scale;

    image(bg, (width - w) / 2, (height - h) / 2, w, h);
  }

  // Darken the image slightly to make particles visible.
  noStroke();
  fill(0, 0, 0, 28);
  rect(0, 0, width, height);

  if (analyser && frequencyData) {
    analyser.getByteFrequencyData(frequencyData);

    let all = 0;
    let low = 0;
    let high = 0;

    for (let i = 0; i < frequencyData.length; i++) {
      all += frequencyData[i];
      if (i < 14) low += frequencyData[i];
      if (i > 70) high += frequencyData[i];
    }

    energy = lerp(
      energy, all / frequencyData.length / 255, 0.1
    );
    bass = lerp(bass, low / 14 / 255, 0.08);
    treble = lerp(
      treble,
      high / max(1, frequencyData.length - 70) / 255,
      0.08
    );
  }

  disturbance *= 0.96;

  // Particles respond to the ambient audio.
  for (let p of particles) {
    p.update();
    p.show();
  }
}

class Particle {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    const a = random(TWO_PI);
    const r = random(
      min(width, height) * 0.08,
      min(width, height) * 0.62
    );

    this.x = width / 2 + cos(a) * r;
    this.y = height / 2 + sin(a) * r;

    this.vx = random(-0.12, 0.12);
    this.vy = random(-0.12, 0.12);
    this.phase = random(TWO_PI);
    this.size = random(0.6, 2.0);
  }

  update() {
    const cx = width / 2;
    const cy = height / 2;

    const dx = this.x - cx;
    const dy = this.y - cy;
    const angle = atan2(dy, dx);

    const swirl = 0.012 + bass * 0.055;
    this.vx += -sin(angle) * swirl;
    this.vy += cos(angle) * swirl;

    // Gentle inward drift.
    this.vx -= dx * 0.00025;
    this.vy -= dy * 0.00025;

    // A delicate vibration from higher frequencies.
    this.vx += sin(frameCount * 0.012 + this.phase)
      * treble * 0.07;
    this.vy += cos(frameCount * 0.014 + this.phase)
      * treble * 0.07;

    // Finger or mouse movement creates a soft disturbance.
    const px = this.x - pointerX;
    const py = this.y - pointerY;
    const d = sqrt(px * px + py * py);
    const radius = min(width, height) * 0.25;

    if (disturbance > 0.01 && d < radius) {
      const force = disturbance * (1 - d / radius);
      this.vx += px / max(1, d) * force * 0.45;
      this.vy += py / max(1, d) * force * 0.45;
    }

    this.vx *= 0.989;
    this.vy *= 0.989;

    this.x += this.vx;
    this.y += this.vy;

    if (
      this.x < -20 || this.x > width + 20 ||
      this.y < -20 || this.y > height + 20
    ) {
      this.reset();
    }
  }

  show() {
    const pulse =
      0.5 + 0.5 * sin(frameCount * 0.018 + this.phase);

    const alpha = constrain(
      25 + pulse * 75 + energy * 150 + bass * 40,
      15, 180
    );

    noStroke();
    fill(235, 238, 245, alpha);
    circle(this.x, this.y, this.size + energy * 2);
  }
}

function movePointer(x, y) {
  pointerX = x;
  pointerY = y;
  disturbance = 1;
}

function mouseMoved() {
  movePointer(mouseX, mouseY);
}

function mouseDragged() {
  movePointer(mouseX, mouseY);
  return false;
}

function touchStarted() {
  movePointer(mouseX, mouseY);
  return false;
}

function touchMoved() {
  movePointer(mouseX, mouseY);
  return false;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
