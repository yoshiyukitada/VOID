
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VOID — Deep Ambient 001</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  overflow: hidden; background: #000;
  font-family: Arial, sans-serif;
}
canvas { display: block; }
#start {
  position: fixed; inset: 0; z-index: 5;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  background: #000; color: #fff;
}
#title { font-size: 28px; letter-spacing: .45em; margin-left: .45em; }
#subtitle { margin-top: 14px; font-size: 10px; letter-spacing: .25em; color: #888; }
#instruction { margin-top: 48px; font-size: 9px; letter-spacing: .2em; color: #777; }
#start.hidden { display: none; }
#caption {
  position: fixed; left: 18px; bottom: 18px;
  color: #777; font-size: 9px; letter-spacing: .2em;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="start">
  <div id="title">VOID</div>
  <div id="subtitle">DEEP AMBIENT / 001</div>
  <div id="instruction">TOUCH TO ENTER</div>
</div>

<div id="caption">A FIELD OF SILENCE</div>

<audio id="ambient" src="VOID_Deep_Ambient_001.mp3"
       loop preload="auto"></audio>

<script>
let analyser, freq;
let audioContext;
let started = false;
let energy = 0, bass = 0, treble = 0;
let touchPower = 0;
let touchX = 0, touchY = 0;

const CURVES = 7;
const DOTS = 25;

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  touchX = width / 2;
  touchY = height / 2;

  document.getElementById("start")
    .addEventListener("click", startAudio);
}

async function startAudio() {
  if (started) return;

  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    await audioContext.resume();

    const audio = document.getElementById("ambient");
    const source = audioContext.createMediaElementSource(audio);

    const filter = audioContext.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 7000;

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.88;
    freq = new Uint8Array(analyser.frequencyBinCount);

    const volume = audioContext.createGain();
    volume.gain.value = 0.85;

    source.connect(filter);
    filter.connect(analyser);
    analyser.connect(volume);
    volume.connect(audioContext.destination);

    await audio.play();
    started = true;
    document.getElementById("start").classList.add("hidden");
  } catch (e) {
    document.getElementById("instruction").textContent =
      "CHECK AUDIO FILE AND TRY AGAIN";
    console.error(e);
  }
}

function draw() {
  background(0);

  if (analyser) {
    analyser.getByteFrequencyData(freq);
    let sum = 0, low = 0, high = 0;

    for (let i = 0; i < freq.length; i++) {
      sum += freq[i];
      if (i < 14) low += freq[i];
      if (i > 70) high += freq[i];
    }

    energy = lerp(energy, sum / freq.length / 255, 0.08);
    bass = lerp(bass, low / 14 / 255, 0.07);
    treble = lerp(
      treble,
      high / max(1, freq.length - 70) / 255,
      0.07
    );
  }

  touchPower *= 0.96;

  const cx = width * 0.5;
  const cy = height * 0.5;
  const unit = min(width, height);
  const base = unit * 0.235;

  // Very fine central axes
  stroke(170, 170, 170, 85);
  strokeWeight(0.65);
  line(cx - unit * 0.44, cy, cx + unit * 0.44, cy);
  line(cx, cy - unit * 0.40, cx, cy + unit * 0.40);

  // Dots along the horizontal and vertical axes
  noStroke();
  for (let i = 0; i < DOTS; i++) {
    const u = map(i, 0, DOTS - 1, -0.43, 0.43);
    const pulse = 0.5 + 0.5 * sin(frameCount * 0.018 + i * 0.7);
    const size = (i % 6 === 0 ? 3.2 : 1.4) + pulse * energy * 2;

    fill(235, 235, 235, 100 + pulse * 120);
    circle(cx + u * unit, cy, size);
    circle(cx, cy + u * unit, size);
  }

  // Seven flat, overlapping wave contours
  for (let k = 0; k < CURVES; k++) {
    const phase = frameCount * 0.008 + k * 0.62;
    const spread = 0.60 + k * 0.105;
    const amplitude = base * (0.48 + k * 0.065);

    noFill();
    stroke(230, 230, 235, 105 - k * 10 + energy * 50);
    strokeWeight(k === 0 ? 1.05 : 0.65);

    beginShape();
    const steps = 180;

    for (let j = 0; j <= steps; j++) {
      const a = TWO_PI * j / steps;

      const wave1 = sin(a * 2 + phase) * amplitude * 0.30;
      const wave2 = sin(a * 3 - phase * 0.7) * amplitude * 0.12;
      const audioShape = bass * amplitude * 0.45 *
                         sin(a * 2 + phase * 1.4);

      const r = base * spread + wave1 + wave2 + audioShape;
      const x = cx + cos(a) * r * (1.0 + 0.18 * cos(a * 2 + phase));
      const y = cy + sin(a) * r * (1.12 + 0.12 * sin(a * 3 - phase));

      vertex(x, y);
    }
    endShape(CLOSE);
  }

  // Tiny points distributed around the contours
  for (let i = 0; i < 110; i++) {
    const a = i * 2.39996 + frameCount * 0.0015;
    const ring = base * (0.72 + (i % 13) * 0.052);
    const wobble = sin(frameCount * 0.012 + i) *
                   (1 + treble * 12);

    const x = cx + cos(a) * (ring + wobble);
    const y = cy + sin(a) * (ring * 1.10 + wobble);

    const s = i % 17 === 0 ? 2.4 : 1.0;
    noStroke();
    fill(235, 235, 240, 65 + energy * 150);
    circle(x, y, s);
  }

  // Central white disk
  noStroke();
  fill(248, 248, 248);
  circle(cx, cy, unit * (0.037 + bass * 0.012));

  // A touch gently disturbs the geometry
  if (touchPower > 0.01) {
    noFill();
    stroke(220, 220, 220, touchPower * 100);
    strokeWeight(0.7);
    circle(
      touchX, touchY,
      unit * 0.05 + (1 - touchPower) * unit * 0.2
    );
  }
}

function disturb(x, y) {
  touchX = x;
  touchY = y;
  touchPower = 1;
}

function mousePressed() {
  disturb(mouseX, mouseY);
}

function mouseMoved() {
  disturb(mouseX, mouseY);
}

function touchStarted() {
  disturb(mouseX, mouseY);
  return false;
}

function touchMoved() {
  disturb(mouseX, mouseY);
  return false;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
